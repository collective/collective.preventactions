[buildout]
extends =
    https://dist.plone.org/release/6.1.0/versions.cfg
extensions = mr.developer
show-picked-versions = true
parts =
    instance
    test
    omelette
    i18ndude

develop = .


[instance]
recipe = plone.recipe.zope2instance
user = admin:admin
http-address = 8080
eggs =
    Plone
    Pillow

zcml =
    collective.preventactions:testing.zcml

environment-vars =
    zope_i18n_compile_mo_files true


[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}


[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
defaults = ['-s', 'collective.preventactions', '--auto-color', '--auto-progress']


[robot]
recipe = zc.recipe.egg
eggs =
    Pillow
    ${test:eggs}
    plone.app.robotframework[debug,reload]


[i18ndude]
recipe = zc.recipe.egg
eggs = i18ndude


[versions]
# Don't use a released version of collective.preventactions
collective.preventactions =
